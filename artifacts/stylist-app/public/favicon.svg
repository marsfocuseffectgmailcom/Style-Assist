<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: top slightly brighter navy, bottom deep navy -->
    <linearGradient id="bg" x1="90" y1="0" x2="90" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2B3D5A"/>
      <stop offset="100%" stop-color="#0D1824"/>
    </linearGradient>

    <!-- Subtle inner highlight: very faint warm center glow for premium feel -->
    <radialGradient id="centerGlow" cx="50%" cy="44%" r="46%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hanger shadow: soft, not heavy -->
    <filter id="hangerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="38" fill="url(#bg)"/>
  <!-- Subtle center glow overlay -->
  <rect width="180" height="180" rx="38" fill="url(#centerGlow)"/>

  <!-- ── Hanger: warm ivory, clean strokes, soft shadow ── -->

  <!-- Hook: J-shape rising from shoulder apex -->
  <!-- Vertical stem up, arc right, arc back down — classic hook silhouette -->
  <path
    d="M90,70 L90,55 Q90,43 99,43 Q109,43 109,54 Q109,61 101,64"
    stroke="#EEE4C6"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#hangerShadow)"
  />

  <!-- Shoulders + bottom rail: V-shape closing into bottom bar -->
  <path
    d="M32,116 L90,70 L148,116 L32,116"
    stroke="#EEE4C6"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#hangerShadow)"
  />
</svg>
