kind = "web"
previewPath = "/"
title = "AI Fashion Stylist"
version = "1.0.0"
id = "artifacts/stylist-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23601

[services.development]
run = "pnpm --filter @workspace/stylist-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stylist-app", "run", "build" ]
publicDir = "artifacts/stylist-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23601"
BASE_PATH = "/"
